name: Nightly

# TASK-465: rolling nightly pre-release built from main, playStore flavor.
#
# TASK-784 automation (maintainer decision 2026-10-08, superseding the
# dispatch-only 2026-09-08 stance taken before the manual flow was proven):
# a daily schedule rebuilds the nightly ONLY when origin/main carries commits
# newer than the commit recorded in the current nightly release body (the
# gate job parses that line); an unchanged codebase is skipped, so the
# channel is what the FAQ promises (rolling main) without empty rebuilds.
# A MANUAL dispatch bypasses the gate on purpose: a human triggering by hand
# (rotated secrets, a flaky asset) wants the rebuild regardless.
#
# F-DROID SAFETY: the release is published on the rolling tag `nightly`, which is
# NOT semver ON PURPOSE. The fdroiddata recipe uses UpdateCheckMode: Tags, and
# fdroidserver's check_tags() parses EVERY tag with no name filter (verified in
# fdroidserver master 3cbbe810, fdroidserver/checkupdates.py): the bot reads the
# versionCode at the tag's commit and only stays quiet while that code does not
# exceed the released CurrentVersionCode. The tag name alone is NOT protection.
# Before the first publish the recipe must get the documented pattern filter
# (`UpdateCheckMode: Tags ^v[\d.]+$`, plain vX.Y.Z tags only), the one allowed fdroiddata edit per the
# TASK-465 plan; until then never let main's versionCode exceed the released one
# (it must not: the nightly stays at the current base). See docs/ci.md.
# Do NOT rename this tag to anything resembling X.Y.Z.
#
# Signature truth (device-verified 2026-09-09): the APK is signed with the
# PROJECT RELEASE KEY, the same keystore android-release.yml signs its uploaded
# AAB with, and the key the F-Droid recipe pins (AllowedAPKSigningKeys). That
# is NOT the signature a store-delivered install carries: Google re-signs Play
# deliveries via Play App Signing, and F-Droid signs its own builds, so moving
# to a nightly from EITHER store requires uninstalling first (erasing
# downloaded models). The signature does match previous nightlies and the
# The .nightly id installs alongside store builds; the release body carries the transition note.

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:23 UTC (05:23 CEST summer / 04:23 CET after the late-
    # October switch): the maintainer's morning build.
    # Off the :00 mark to share nobody's cron burst.
    - cron: '23 3 * * *'

permissions:
  contents: write

# Two manual runs must not race on the same rolling tag and release.
concurrency:
  group: nightly
  # TASK-784 review: only a MANUAL dispatch supersedes a running build. A
  # scheduled run queues instead (cancel-in-progress cancels the RUNNING
  # run, so an unconditional true would let the 03:23 cron kill a live
  # manual rebuild mid-publish); after the build finishes, the queued
  # schedule run gates for ~1 minute and usually skips. A run killed
  # between the tag re-point and the publish self-heals: the release body
  # is written last, so the next gate sees main != recorded and rebuilds.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # TASK-784: the new-commits gate. Parses the rolling release body's
  # `commit: <sha>` line and compares it against origin/main's HEAD; emits
  # skip=true when they match (nothing new to build). The 404 first-run
  # case means "no recorded commit yet": build.
  gate:
    name: Gate - new commits vs the published nightly?
    runs-on: ubuntu-24.04
    # Read-only job: ls-remote needs no token, the one gh call reads a
    # public release (review F2; the workflow-level contents:write is for
    # the build job's tag push and publish).
    permissions:
      contents: read
    # Two ~1s network calls; the 360-minute default would pin a runner for
    # hours on a stalled socket (review F2).
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Compare main HEAD with the nightly release body's commit
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          # The file's own release-fetch idiom (the Delete-previous-assets
          # step): the JSON branch parses, the 404 branch builds, any other
          # failure fails loudly. A plain grep-pipe under pipefail would
          # kill the 404 first-run path at the parse line (review F1).
          ERR=$(mktemp)
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>"$ERR") || RELEASE_JSON=""
          RECORDED=""
          if [ -n "$RELEASE_JSON" ]; then
            RECORDED=$(jq -r '.body' <<<"$RELEASE_JSON" \
              | grep -m1 -oE -- '- commit: [0-9a-f]{40}' | cut -d' ' -f3) || RECORDED=""
          else
            grep -q "HTTP 404" "$ERR" || { cat "$ERR" >&2; exit 1; }
          fi
          echo "main HEAD:      $HEAD_SHA"
          echo "nightly commit: ${RECORDED:-<none, first run>}"
          if [ -n "$RECORDED" ] && [ "$RECORDED" = "$HEAD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since the published nightly; the build job will skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Build + publish nightly pre-release
    needs: gate
    # Schedule: only with new commits AND a healthy gate (a red gate on
    # schedule means investigate, not rebuild blind). Manual dispatch:
    # always, even past a red gate - a human dispatching by hand is the
    # fallback precisely because something is already wrong (review F1:
    # the bare || would have skipped the build on a failed gate via the
    # implicit success() status check).
    if: github.event_name == 'workflow_dispatch' ||
        (needs.gate.result == 'success' && needs.gate.outputs.skip != 'true')
    runs-on: ubuntu-24.04  # TASK-683.9: pinned before the 2026-10-19 ubuntu-latest -> Ubuntu 26 migration

    steps:
      # Always main: the nightly is "whatever main looks like right now".
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history is not needed, but the tag push below needs the origin
          # remote configured, which checkout provides.
          fetch-depth: 1

      # TASK-784 review: record the CHECKOUT's HEAD, not github.sha. On
      # schedule events github.sha is the trigger-time HEAD while the
      # artifacts build from this fresh checkout a moment later; the tag
      # and the release body (the gate's source of truth) must identify
      # the tree that was actually built.
      - name: Record the built commit
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # GITHUB_OUTPUT is mandatory: a bare `date` print never reaches
      # steps.date.outputs, which shipped every release name as "Nightly ()"
      # since the workflow exists (found on the 2026-09-17 run).
      - name: Record run date (UTC)
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Testers' downloaded models survive an update unless the model
      # download/layout surface changed since the last stable release; the
      # body line tells them which case this build is. Runs before the build
      # and before any destructive step: a fetch failure here must not abort
      # a run that already moved the rolling tag or deleted assets. BASE is
      # picked from remote metadata with the F-Droid recipe's own filter
      # (^v\d+\.\d+\.\d+$, plain stables only): sort -V alone would let a
      # v*-rc/beta tag of a higher version win and silently narrow the diff
      # window; only the chosen tag's commit is then fetched (bounded).
      - name: Model re-download verdict
        id: models
        run: |
          set -euo pipefail
          BASE=$(git ls-remote --refs --tags origin "refs/tags/v*" \
            | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk -F/ '{print $NF}' | sort -V | tail -1)
          [ -n "$BASE" ] || { echo "no stable v* tag found" >&2; exit 1; }
          git fetch --depth=1 --quiet origin "refs/tags/$BASE:refs/tags/$BASE"
          CHANGED=$(git diff --name-only "$BASE" "$BUILT_SHA" -- \
            .sherpa-version \
            scripts/fetch-sherpa-aar.sh \
            scripts/fetch-whistle-engine.sh \
            app/src/main/assets/models_catalog.json \
            app/src/main/java/com/antivocale/app/transcription/BuiltInBackendIds.kt \
            app/src/main/java/com/antivocale/app/transcription/OrphanedModelDirCleaner.kt \
            app/src/main/java/com/antivocale/app/transcription/SherpaModelManager.kt \
            app/src/main/java/com/antivocale/app/transcription/SherpaModelDownloader.kt)
          if [ -n "$CHANGED" ]; then
            echo "note=this build MAY REQUIRE re-downloading models (the model set or engine changed since $BASE)." >> "$GITHUB_OUTPUT"
          else
            echo "note=no model re-download needed (model set unchanged since $BASE)." >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Same secret + same layout as the release AAB step in android-release.yml.
      # FALLBACK ONLY for the nightly variant: the google-services plugin
      # resolves the COMMITTED src/nightly/google-services.json (with the
      # .nightly client) first; this root json lacks that client and would
      # fail the build if the source-set file ever disappeared. Keep it as
      # the safety net for any future release-variant build in this workflow.
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json

      - name: Fetch sherpa-onnx AAR
        run: ./scripts/fetch-sherpa-aar.sh

      # TASK-853: the Whistle JNI bridge needs libneedle.a per arm ABI.
      - name: Fetch whistle engine
        run: |
          pip install cactus-needle
          ./scripts/fetch-whistle-engine.sh

      # Signing EXACTLY as android-release.yml signs its playStore release
      # builds: KEYSTORE_BASE64 -> app/release.keystore, KEYSTORE_PROPERTIES ->
      # keystore.properties, then repoint storeFile at the written file. No new
      # secrets introduced.
      - name: Write release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties
          sed -i 's|storeFile=.*|storeFile=release.keystore|' keystore.properties

      # Review F3 (TASK-838): this workflow was the ONLY one assembling the
      # playStore RELEASE variant; leaving it nightly-only would turn a
      # release-only regression (signing, split packaging, the R8 path) into
      # a release-day failure. One invocation builds both (review 2026-10-15:
      # a single gradlew call shares configuration and the daemon; two calls
      # doubled the workflow's time for nothing).
      - name: Build playStore NIGHTLY APKs + the release smoke (per-ABI splits, the .nightly id)
        run: ./gradlew :app:assemblePlayStoreNightly :app:assemblePlayStoreRelease --console=plain

      # Review 2026-10-15: the nightly ships R8-minified with Crashlytics
      # enabled; without the mapping upload every nightly crash report
      # arrives obfuscated and undiagnosable.
      - name: Upload Crashlytics mapping for the nightly build
        run: ./gradlew :app:uploadCrashlyticsMappingFilePlayStoreNightly --console=plain

      # Asset names antivocale-nightly-<abi>.apk are DELIBERATELY distinct from
      # every name android-release.yml can publish (app-fdroid-<abi>-release.apk,
      # app-fdroid-<abi>-release-unsigned.apk, antivocale-debug-<abi>.apk,
      # antivocale-fdroid-testsigned-<abi>.apk): a nightly asset can never
      # collide with, or be mistaken for, a release asset. isUniversalApk is
      # false (app/build.gradle.kts), so the glob yields exactly the 3 ABIs.
      - name: Stage nightly APKs
        run: |
          set -euo pipefail
          mkdir -p nightly-apks
          for APK in app/build/outputs/apk/playStore/nightly/app-playStore-*-nightly.apk; do
            ABI=$(basename "$APK" | sed -E 's/^app-playStore-(.+)-nightly\.apk$/\1/')
            case "$ABI" in
              armeabi-v7a|arm64-v8a|x86_64) cp "$APK" "nightly-apks/antivocale-nightly-${ABI}.apk" ;;
              *) echo "::error::unexpected split output '$APK' (ABI '$ABI')"; exit 1 ;;
            esac
          done
          test "$(find nightly-apks -name 'antivocale-nightly-*.apk' | wc -l)" -eq 3 || { echo "::error::expected 3 per-ABI APKs"; exit 1; }
          ls -la nightly-apks/

      - name: Read versionName from the built APK
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME"/build-tools \( -name aapt2 -o -name aapt \) | sort -V | tail -1)
          VERSION_NAME=$("$AAPT" dump badging nightly-apks/antivocale-nightly-arm64-v8a.apk \
            | head -1 | grep -oE "versionName='[^']+'" | cut -d"'" -f2)
          # The versionName gate: fail loudly if the build id is not the
          # unreleased SNAPSHOT (a released nightly would masquerade).
          case "$VERSION_NAME" in
            *-SNAPSHOT) echo "nightly id: $VERSION_NAME" ;;
            *) echo "::error::nightly built a non-SNAPSHOT versionName ($VERSION_NAME); bump main to the next -SNAPSHOT first"; exit 1 ;;
          esac
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      # Re-point the rolling tag at this run's commit (delete + recreate the
      # ref via a forced push). The F-Droid safety of this whole design rests on
      # `nightly` parsing as no version; keep the name as-is. NOTE: if repo
      # protected tags ever start matching `nightly`, this push fails and the
      # workflow fails loudly - that is intended, unprotect the tag first.
      - name: Re-point the nightly tag at this commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$BUILT_SHA"
          git push --force origin refs/tags/nightly

      # Replace the assets: drop any same-named assets from the existing
      # nightly release before uploading, so a failed upload can never leave a
      # stale APK silently paired with a new build. The release does not exist
      # on the first run: gh api then writes the 404 body to stdout, whose
      # tokens would be treated as asset IDs, so capture the JSON once and
      # only iterate when the release answered.
      - name: Delete previous nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ERR=$(mktemp)
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>"$ERR") || RELEASE_JSON=""
          if [ -n "$RELEASE_JSON" ]; then
            ASSET_IDS=$(jq -r '.assets[] | select(.name | startswith("antivocale-nightly-")) | .id' <<<"$RELEASE_JSON")
            for ID in $ASSET_IDS; do
              echo "deleting old asset $ID"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$ID"
            done
          else
            # 404 = the release does not exist yet (first run). Any other
            # failure (rate limit, 5xx) must fail the step: skipping the
            # delete silently would let a stale APK survive the upload.
            grep -q "HTTP 404" "$ERR" || { cat "$ERR" >&2; exit 1; }
            echo "no existing nightly release; nothing to delete"
          fi

      # Create-or-update the pre-release. softprops updates the existing release
      # for the tag when one is present. GH.Release body: versionName from the
      # build, commit SHA, the untested-snapshot warning, the signature caveat,
      # and the explicit not-for-F-Droid note.
      - name: Publish nightly pre-release
        # TASK-683.9: v3 is the node24 runtime line (runtime move only).
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly (${{ steps.date.outputs.date }})
          prerelease: true
          make_latest: false
          files: nightly-apks/antivocale-nightly-*.apk
          body: |
            **Nightly build, generated automatically from main.**

            - versionName: ${{ env.VERSION_NAME }} (the About row in the app shows the same)
            - built: ${{ steps.date.outputs.date }} (UTC)
            - models: ${{ steps.models.outputs.note }}

            :warning: **Untested snapshot.** This build has passed compilation only: no test suite, no device verification, no review. Expect breakage.

            :warning: **Not for F-Droid users.** Stay on the F-Droid release. This rolling tag is intentionally non-semantic so the F-Droid update checker never offers it.

            :information_source: **Installs alongside your store app:** the nightly carries its own application id (com.antivocale.app.nightly) and label "Anti-Vocale Nightly", so it never replaces or uninstalls a Play or F-Droid build, and it updates in place over another nightly. Downloaded models live per application id: the nightly starts with an empty library and re-downloads what you use. ONE-TIME NOTE (first .nightly publish): every earlier nightly was the store id com.antivocale.app, so this build installs as a SECOND app next to the old one; remove the old "Anti-Vocale" nightly by hand once you have moved.

            For stable releases see https://github.com/${{ github.repository }}/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Failure modes: nothing above is wrapped in `|| true`. If the tag move or
      # the upload fails mid-way the workflow is red; a partially-updated
      # nightly (new tag, old body or old assets) is acceptable ONLY as a
      # visible failure, which this is.
      - name: Sanity - the nightly release exists with 3 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '[.assets[] | select(.name | startswith("antivocale-nightly-"))] | length')
          test "$COUNT" -eq 3 || { echo "::error::nightly release has $COUNT nightly assets, expected 3 (partial publish)"; exit 1; }
          echo "OK: 3 nightly assets on the rolling pre-release"
          # TASK-784 review CR3: the commit line is the publish WITNESS,
          # appended only now. softprops v3 writes the release body BEFORE
          # uploading assets, so a body carrying the new commit alongside a
          # partial upload would make every later gate skip forever (body
          # == main HEAD, assets incomplete). With the line appended here,
          # an interrupted publish leaves the body WITHOUT a commit line:
          # the next gate sees "no recorded commit" and rebuilds.
          BODY=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '.body')
          printf '%s\n- commit: %s\n' "$BODY" "$BUILT_SHA" | gh release edit nightly --notes-file -
          echo "commit witness appended: $BUILT_SHA"

      # Retention: after a successful publish, remove any OTHER nightly-*
      # pre-release (a dated-tag scheme from an earlier era, or an accidental
      # duplicate), so the repo never accumulates rolling snapshots. The current
      # release (tag exactly `nightly`) is always kept.
      - name: Delete old nightly-* pre-releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq \
            '.[] | select(.prerelease) | select(.tag_name | test("^nightly-")) | .tag_name' \
            | sort -u | while read -r TAG; do
              echo "deleting stale nightly pre-release: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            done
